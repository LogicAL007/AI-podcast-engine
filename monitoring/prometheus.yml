# Scrape configuration for the compose stack. Targets are compose service names.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Request count and latency per route.
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Stage attempts, failures and durations. One worker container per pipeline stage;
  # a stage that is not running shows as down (`up == 0`).
  - job_name: stage_workers
    static_configs:
      - targets:
          - ingest:9100
          - index:9100
          - retrieve_plan:9100
          - script:9100
          - factcheck:9100
          - voice:9100
          - assemble:9100
          - publish:9100
