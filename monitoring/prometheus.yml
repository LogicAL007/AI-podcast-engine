# Scrape configuration for the compose stack. Targets are compose service names.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Request count and latency per route.
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Stage attempts, failures and durations, labelled by stage. Five worker containers serve
  # the eight stages; a worker that is not running shows as down (`up == 0`).
  - job_name: stage_workers
    static_configs:
      - targets:
          - ingest_publish:9100
          - index_plan:9100
          - script_factcheck:9100
          - voice:9100
          - assemble:9100
