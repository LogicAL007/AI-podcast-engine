server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Find the API through Docker's DNS on each request (cached 10 s), not once at startup: a
  # restarted container can come back on another address, which nginx would otherwise keep
  # calling (502 Bad Gateway) until it restarted too. A variable in proxy_pass makes it re-resolve.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;
  set $api_upstream http://api:8000;

  # For everything, the API included.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;

  # Metrics are for Prometheus on the internal network, not for browsers.
  location = /api/metrics {
    return 404;
  }

  # Live episode progress (server-sent events): pass each event on at once, and keep the
  # connection open while the API holds it (it ends streams within an hour).
  location ~ ^/api/v1/episodes/[^/]+/events$ {
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /api;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    # PDF uploads: a little above the API's own limit (MAX_UPLOAD_MB, 25 by default), so the API
    # answers 413 with a clear message instead of nginx refusing at 1 MB.
    client_max_body_size 26m;
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    # So the home document and catalog build their links with /api in front.
    proxy_set_header X-Forwarded-Prefix /api;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Built files have content hashes in their names, so they can be cached for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # The web app. Its pages may load only this site's own scripts, styles, audio and data, and
  # may not be framed; a script injected into a page could not phone home. The one inline style
  # allowed, by hash, is the fixed <style> @paper-design/shaders adds for the liquid logo
  # (pinned at 0.0.81; a new version changes the text, so re-check the hash when upgrading).
  # Images and audio may also be blob: URLs, which the page makes itself: the logo's processed mask,
  # and a voice recording played back before it is registered.
  location / {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'sha256-bcX2M6hOeEgeI9Ttj3KtXWZuoRsKenyQAlXswSnLakA='; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
