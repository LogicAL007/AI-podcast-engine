server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Metrics are for Prometheus on the internal network, not for browsers.
  location = /api/metrics {
    return 404;
  }

  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
