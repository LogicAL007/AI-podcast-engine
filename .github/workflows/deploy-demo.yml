name: Deploy demo

# Continuous deployment of the AWS demo server (infra/demo).
#   - After CI passes on main, the new commit is deployed, but only while the server is running.
#     A stopped server is left stopped, so nothing costs money by surprise.
#   - By hand (Actions -> Deploy demo -> Run workflow): deploy, start or stop the server.
# The workflow signs in to AWS through GitHub's OIDC provider and the role infra/demo/github.tf
# creates; no AWS keys are stored in GitHub. Settings and API keys stay in SSM Parameter Store,
# where infra/demo/deploy.sh put them, and the server reads them itself.
# Configure once with `make aws-demo-ci-vars`, which sets the `demo` environment's variables.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: What to do with the demo server
        type: choice
        options: [deploy, start, stop]
        default: deploy

permissions:
  contents: read
  id-token: write # to sign in to AWS through OIDC

concurrency:
  group: demo-server # one deploy, start or stop at a time; never cancel one halfway
  cancel-in-progress: false

jobs:
  demo:
    # Skipped until the demo exists (no role configured), and after a failed CI run.
    if: >-
      vars.DEMO_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: demo
    timeout-minutes: 120
    env:
      AWS_REGION: ${{ vars.DEMO_REGION || 'ca-central-1' }}
      BUCKET: ${{ vars.DEMO_BUCKET }}
      INSTANCE: ${{ vars.DEMO_INSTANCE_ID }}
      SITE_URL: ${{ vars.DEMO_SITE_URL }}
      ACTION: ${{ inputs.action || 'deploy' }}
      AUTOMATIC: ${{ github.event_name == 'workflow_run' }}
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEMO_ROLE_ARN }}
          role-session-name: deploy-demo-${{ github.run_id }}
          role-duration-seconds: 7200
          aws-region: ${{ env.AWS_REGION }}

      - name: Server state
        id: server
        run: |
          state=$(aws ec2 describe-instances --instance-ids "$INSTANCE" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "The demo server is $state."

      - name: Stop the server
        if: env.ACTION == 'stop'
        run: |
          aws ec2 stop-instances --instance-ids "$INSTANCE" >/dev/null
          aws ec2 wait instance-stopped --instance-ids "$INSTANCE"
          echo "### Demo server stopped" >> "$GITHUB_STEP_SUMMARY"

      - name: Start the server
        if: env.ACTION == 'start'
        run: |
          if [ "${{ steps.server.outputs.state }}" != running ]; then
            aws ec2 start-instances --instance-ids "$INSTANCE" >/dev/null
            aws ec2 wait instance-running --instance-ids "$INSTANCE"
          fi
          echo "Running; the stack starts by itself."

      - name: Skip a stopped server
        id: gate
        if: env.ACTION == 'deploy'
        run: |
          if [ "${{ steps.server.outputs.state }}" = running ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ "$AUTOMATIC" = true ]; then
            echo "::notice::The demo server is ${{ steps.server.outputs.state }}; not deploying $COMMIT."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The demo server is ${{ steps.server.outputs.state }}. Run this workflow with 'start' first."
            exit 1
          fi

      - name: Upload the release
        if: steps.gate.outputs.go == 'true'
        run: |
          # Tracked files at this commit: never secrets/ contents, .env or research/ (all ignored).
          git archive --format=tar.gz -o release.tgz "$COMMIT"
          aws s3 cp --only-show-errors release.tgz "s3://$BUCKET/releases/$COMMIT.tgz"
          aws s3 cp --only-show-errors release.tgz "s3://$BUCKET/releases/current.tgz"
          echo "Release $COMMIT uploaded ($(du -h release.tgz | cut -f1))."

      - name: Deploy on the server
        if: steps.gate.outputs.go == 'true'
        run: |
          command=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
            --comment "deploy ${COMMIT:0:12} from GitHub run ${{ github.run_id }}" --timeout-seconds 600 \
            --parameters '{"commands":["/opt/demo/deploy.sh"],"executionTimeout":["7200"]}' \
            --query Command.CommandId --output text)
          echo "SSM command $command"
          status=Pending
          for _ in $(seq 1 330); do # up to 110 minutes; a deploy that changes dependencies rebuilds images
            sleep 20
            status=$(aws ssm get-command-invocation --command-id "$command" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$command" --instance-id "$INSTANCE" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text | tail -40
          [ "$status" = Success ] || { echo "::error::The deploy ended with status $status."; exit 1; }

      - name: Smoke test
        if: steps.gate.outputs.go == 'true' || env.ACTION == 'start'
        run: |
          # /api/ready answers 200 only when the API reaches its database, queue, storage and Vault.
          curl -fsS --retry 30 --retry-delay 20 --retry-all-errors --max-time 10 "$SITE_URL/api/ready"
          echo
          {
            echo "### Demo is up"
            echo "- Site: $SITE_URL"
            echo "- Commit: \`$COMMIT\`"
          } >> "$GITHUB_STEP_SUMMARY"
