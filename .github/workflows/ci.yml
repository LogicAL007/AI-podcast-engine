name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[api,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest tests/unit

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          cp .env.example .env
          mkdir -p secrets && touch secrets/llm_api_key.txt secrets/tts_api_key.txt
          docker compose config --quiet
      - name: Validate the AWS demo overlays (Gemini voices, and GPU)
        run: |
          export SITE_ADDRESS=demo.example
          docker compose -f docker-compose.yml -f infra/demo/docker-compose.aws.yml config --quiet
          docker compose -f docker-compose.yml -f infra/demo/docker-compose.aws.yml -f infra/demo/docker-compose.aws-gpu.yml config --quiet
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/stage.Dockerfile
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: web/Dockerfile

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
      - name: Terraform format and validate (no AWS access needed)
        working-directory: infra/demo
        run: |
          terraform fmt -check -diff
          terraform init -input=false -backend=false
          terraform validate
      - name: Shellcheck the deploy scripts
        run: |
          # The server's bootstrap is a Terraform template: fill in its three values first, then
          # check it and the deploy script it writes on the server.
          sed -e 's/\${bucket}/demo-bucket/; s/\${ssm_prefix}/\/podcast-demo/; s/\${region}/ca-central-1/; s/\${gpu}/false/; s/\$\${/${/g' \
            infra/demo/user_data.sh.tftpl > /tmp/user_data.sh
          awk '/^cat > \/opt\/demo\/deploy.sh/{f=1;next} /^DEPLOY$/{f=0} f' /tmp/user_data.sh > /tmp/server_deploy.sh
          shellcheck infra/demo/deploy.sh /tmp/user_data.sh /tmp/server_deploy.sh
