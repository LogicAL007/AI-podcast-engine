name: podcast-engine

# Pipeline: ingest -> index -> retrieve_plan -> script <-> factcheck -> voice -> assemble -> publish
# Every stage is its own worker container consuming its own queue, so stages scale and retry
# independently. State lives in Postgres, Redis and S3 storage; workers are stateless.
#
# Volume map
#   Named volumes (managed by Docker):
#     pgdata         postgres:/var/lib/postgresql/data      database files
#     redisdata      redis:/data                            queue persistence (AOF)
#     s3data         s3:/data                               episode audio, feeds, cached objects
#     uploads        api (rw) + ingest (ro):/data/uploads   private user uploads (PDFs)
#     ingest_cache   ingest:/data/ingest                    raw fetch cache, ETags
#     hf_cache       index, retrieve_plan                   embedding model weights
#     tts_cache      voice:/data/tts_cache                  synthesised lines, reused on regen
#     audio_scratch  voice (rw) + assemble (rw):/data/audio working audio between stages
#     feed_staging   publish:/data/feeds                    rendered RSS before upload
#     scheduler_state scheduler:/data/scheduler             last-seen hashes / run markers
#     prometheus_data prometheus:/prometheus                metrics time series (15 days)
#   Bind mounts (read-only, edited on the host):
#     ./config, ./prompts, ./assets, ./db/init, ./web/nginx.conf, ./monitoring/prometheus.yml

x-app-env: &app-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://s3:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
  S3_BUCKET: ${S3_BUCKET:-podcast-episodes}
  S3_REGION: ${S3_REGION:-us-east-1}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
  LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
  LLM_MODEL: ${LLM_MODEL:-gemini-3.8-flash}
  TTS_PROVIDER: ${TTS_PROVIDER:-hosted}
  MAX_REWRITES: ${MAX_REWRITES:-2}
  EPISODE_COST_CAP_USD: ${EPISODE_COST_CAP_USD:-1.00}
  PUBLIC_FEED_BASE_URL: ${PUBLIC_FEED_BASE_URL:-http://localhost:8080}
  # Lets uvicorn's and Celery's several processes report one merged set of metrics.
  PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-worker: &worker
  <<: *hardening
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    s3-init: { condition: service_completed_successfully }
  environment: *app-env
  expose: ["9100"] # /metrics, scraped by prometheus
  healthcheck:
    test: [CMD, python, -m, podcast_engine.worker, --healthcheck]
    interval: 30s
    timeout: 10s
    start_period: 60s
    retries: 3

services:
  # ---------------------------------------------------------------- infrastructure
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object store. MinIO no longer publishes images, so this is RustFS (Apache-2.0).
  # Any S3 service works: only S3_ENDPOINT_URL and the keys change.
  s3:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      RUSTFS_ADDRESS: ":9000"
    ports:
      - "127.0.0.1:9001:9001" # console, local only
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates the bucket (idempotent), then exits. Everything else waits for it.
  s3-init:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/stage.Dockerfile
    restart: "no"
    command: ["python", "-m", "podcast_engine.common.init_storage"]
    depends_on:
      s3: { condition: service_healthy }
    environment: *app-env

  # ---------------------------------------------------------------- observability
  # Metrics only (request rates, latency, stage durations and failures). It does not store logs;
  # those are JSON on each container's stdout (`docker compose logs`).
  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------- application
  api:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/stage.Dockerfile
      target: api
      args: { EXTRAS: api }
    # CMD (uvicorn podcast_engine.api.main:app) and HEALTHCHECK come from the image's api target.
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
    environment:
      <<: *app-env
      UVICORN_WORKERS: ${API_WORKERS:-2}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/data/uploads
      - ./config:/app/config:ro

  web:
    <<: *hardening
    build: ./web
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "8080:80"
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # nginx writes pid, cache and temp files at runtime
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]

  scheduler:
    <<: *worker
    build:
      context: .
      dockerfile: docker/stage.Dockerfile
    command: ["python", "-m", "podcast_engine.scheduler"]
    healthcheck:
      disable: true
    volumes:
      - scheduler_state:/data/scheduler
      - ./config:/app/config:ro

  # ---------------------------------------------------------------- pipeline stages
  ingest:
    <<: *worker
    build:
      context: .
      dockerfile: docker/stage.Dockerfile
      args: { EXTRAS: ingest }
    command: [python, -m, podcast_engine.worker, ingest]
    volumes:
      - ingest_cache:/data/ingest
      - uploads:/data/uploads:ro
      - ./config:/app/config:ro

  index:
    <<: *worker
    build:
      context: .
      dockerfile: docker/stage.Dockerfile
      args:
        EXTRAS: embeddings
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
    command: [python, -m, podcast_engine.worker, index]
    volumes:
      - hf_cache:/home/app/.cache/huggingface
      - ./config:/app/config:ro

  retrieve_plan:
    <<: *worker
    build:
      context: .
      dockerfile: docker/stage.Dockerfile
      args:
        EXTRAS: embeddings,llm
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
    command: [python, -m, podcast_engine.worker, retrieve_plan]
    environment:
      <<: *app-env
      LLM_API_KEY_FILE: /run/secrets/llm_api_key
    secrets: [llm_api_key]
    volumes:
      - hf_cache:/home/app/.cache/huggingface
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro

  script:
    <<: *worker
    build:
      context: .
      dockerfile: docker/stage.Dockerfile
      args: { EXTRAS: llm }
    command: [python, -m, podcast_engine.worker, script]
    environment:
      <<: *app-env
      LLM_API_KEY_FILE: /run/secrets/llm_api_key
    secrets: [llm_api_key]
    volumes:
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro

  factcheck:
    <<: *worker
    build:
      context: .
      dockerfile: docker/stage.Dockerfile
      args: { EXTRAS: llm }
    command: [python, -m, podcast_engine.worker, factcheck]
    environment:
      <<: *app-env
      LLM_API_KEY_FILE: /run/secrets/llm_api_key
    secrets: [llm_api_key]
    volumes:
      - ./prompts:/app/prompts:ro

  voice:
    <<: *worker
    build:
      context: .
      dockerfile: docker/stage.Dockerfile
      args: { EXTRAS: voice }
    command: [python, -m, podcast_engine.worker, voice]
    environment:
      <<: *app-env
      TTS_API_KEY_FILE: /run/secrets/tts_api_key
    secrets: [tts_api_key]
    volumes:
      - tts_cache:/data/tts_cache
      - audio_scratch:/data/audio
      - ./config:/app/config:ro

  assemble:
    <<: *worker
    build:
      context: .
      dockerfile: docker/stage.Dockerfile
      args:
        EXTRAS: assemble
        APT_PACKAGES: ffmpeg
    command: [python, -m, podcast_engine.worker, assemble]
    volumes:
      - audio_scratch:/data/audio
      - ./assets:/app/assets:ro

  publish:
    <<: *worker
    build:
      context: .
      dockerfile: docker/stage.Dockerfile
      args: { EXTRAS: publish }
    command: [python, -m, podcast_engine.worker, publish]
    volumes:
      - feed_staging:/data/feeds

secrets:
  llm_api_key:
    file: ./secrets/llm_api_key.txt
  tts_api_key:
    file: ./secrets/tts_api_key.txt

volumes:
  pgdata:
  redisdata:
  s3data:
  uploads:
  ingest_cache:
  hf_cache:
  tts_cache:
  audio_scratch:
  feed_staging:
  scheduler_state:
  prometheus_data:
