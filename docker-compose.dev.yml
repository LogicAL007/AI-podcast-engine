# Development overlay: `docker compose -f docker-compose.yml -f docker-compose.dev.yml up`
# Mounts ./src read-only and puts it first on PYTHONPATH, so code edits apply on container
# restart without rebuilding images. Postgres, Redis and the S3 API are also exposed on localhost.

x-dev-src: &dev-src
  PYTHONPATH: /app/src

services:
  api:
    command: [uvicorn, podcast_engine.api.main:app, --reload, --reload-dir, /app/src]
    environment:
      <<: *dev-src
      UVICORN_WORKERS: "1" # --reload requires a single process
    volumes:
      - ./src:/app/src:ro
  scheduler:
    environment: *dev-src
    volumes:
      - ./src:/app/src:ro
  postgres:
    ports: ["127.0.0.1:5432:5432"]
  redis:
    ports: ["127.0.0.1:6379:6379"]
  s3:
    ports: ["127.0.0.1:9000:9000"]
