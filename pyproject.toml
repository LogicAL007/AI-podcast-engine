[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "podcast-engine"
version = "0.1.0"
description = "Turns live, changing sources into grounded, multi-voice podcast episodes."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "boto3>=1.34",
    "celery[redis]>=5.4",
    "numpy>=1.26",
    "prometheus-client>=0.20",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "stop-words>=2018.7.23",
    "structlog>=24.1",
]

# One extra per container image, so each stage installs only what it needs.
[project.optional-dependencies]
api = ["fastapi>=0.110", "python-multipart>=0.0.9", "uvicorn[standard]>=0.29"]
ingest = ["feedparser>=6.0", "httpx>=0.27", "lxml>=5.0", "pymupdf>=1.24", "trafilatura>=1.9"]
embeddings = ["pgvector>=0.3", "sentence-transformers>=3.0"]
llm = ["google-genai>=1.0"]
anthropic = ["anthropic>=0.40"]
voice = ["httpx>=0.27"]
assemble = ["numpy>=1.26", "pydub>=0.25", "pyloudnorm>=0.1"]
publish = ["feedgen>=1.0"]
# Voice cloning backend (Chatterbox, MIT). Heavy: pulls torch and pins transformers and gradio, so
# install it in its own environment rather than next to `embeddings`. setuptools is pinned because
# resemble-perth (Chatterbox's watermarker) imports pkg_resources, which setuptools 81+ removed, and
# without it Chatterbox fails to start with "'NoneType' object is not callable".
cloning = ["chatterbox-tts>=0.1.7", "setuptools<81"]
# Everything notebooks/podcast_flow.ipynb imports; sentence-transformers is optional (see `embeddings`).
notebook = [
    "anthropic>=0.40",
    "feedgen>=1.0",
    "google-genai>=1.0",
    "feedparser>=6.0",
    "httpx>=0.27",
    "ipykernel>=6.29",
    "lxml>=5.0",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "numpy>=1.26",
    "pyloudnorm>=0.1",
]
dev = [
    "httpx>=0.27",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/podcast_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "."]

[tool.ruff.lint]
select = [
    "A",     # builtins shadowing
    "ARG",   # unused arguments
    "B",     # bugbear
    "C4",    # comprehensions
    "E",
    "F",
    "I",     # isort
    "N",     # pep8-naming
    "PT",    # pytest style
    "PTH",   # pathlib
    "RUF",
    "S",     # bandit
    "SIM",
    "T20",   # no print
    "UP",    # pyupgrade
    "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG"]
# Evaluation scripts are command-line tools that print their reports.
"evaluation/**" = ["T201"]
# Notebooks print, assert, and use IPython's `display`. `say` is called with fixed arguments (the
# text goes in on stdin, never through a shell). The RNG only picks banter lines.
"notebooks/**" = ["A004", "ARG001", "ARG002", "E402", "E501", "S101", "S311", "S603", "S607", "SIM905", "T201"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "evaluation"]
# Test doubles that replace third-party SDKs on PYTHONPATH; not worth type-checking.
exclude = ["tests/fixtures/"]

[[tool.mypy.overrides]]
# Third-party packages that ship no type information.
module = [
    "boto3.*",
    "chatterbox.*",
    "scipy.*",
    "transformers.*",
    "torch.*",
    "torchaudio.*",
    "botocore.*",
    "celery.*",
    "feedgen.*",
    "feedparser.*",
    "fitz.*",
    "stop_words.*",
    "lxml.*",
    "pgvector.*",
    "pydub.*",
    "pyloudnorm.*",
    "sentence_transformers.*",
    "trafilatura.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyMuPDF ships type hints, but many of its functions are unannotated.
module = ["pymupdf.*", "tests.unit.test_pdf_and_feeds", "tests.integration.test_api_lifecycle"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=podcast_engine --cov-report=term-missing"
markers = [
    "integration: needs the docker compose stack running",
    "notebook: executes notebooks/podcast_flow.ipynb (slow; no network or API key needed)",
]
# PyMuPDF's compiled bindings warn about their own SWIG types on import; nothing to act on.
filterwarnings = [
    "ignore:builtin type Swig:DeprecationWarning",
    "ignore:builtin type swigvarlink:DeprecationWarning",
]
