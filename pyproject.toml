[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "podcast-engine"
version = "0.1.0"
description = "Turns live, changing sources into grounded, multi-voice podcast episodes."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "boto3>=1.34",
    "celery[redis]>=5.4",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "structlog>=24.1",
]

# One extra per container image, so each stage installs only what it needs.
[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
ingest = ["feedparser>=6.0", "httpx>=0.27", "pymupdf>=1.24", "trafilatura>=1.9"]
embeddings = ["pgvector>=0.3", "sentence-transformers>=3.0"]
llm = ["anthropic>=0.40"]
voice = ["httpx>=0.27"]
assemble = ["numpy>=1.26", "pydub>=0.25", "pyloudnorm>=0.1"]
publish = ["feedgen>=1.0"]
dev = [
    "httpx>=0.27",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/podcast_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",     # builtins shadowing
    "ARG",   # unused arguments
    "B",     # bugbear
    "C4",    # comprehensions
    "E",
    "F",
    "I",     # isort
    "N",     # pep8-naming
    "PT",    # pytest style
    "PTH",   # pathlib
    "RUF",
    "S",     # bandit
    "SIM",
    "T20",   # no print
    "UP",    # pyupgrade
    "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Third-party packages that ship no type information.
module = [
    "boto3.*",
    "botocore.*",
    "celery.*",
    "feedgen.*",
    "feedparser.*",
    "fitz.*",
    "pgvector.*",
    "pydub.*",
    "pyloudnorm.*",
    "sentence_transformers.*",
    "trafilatura.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=podcast_engine --cov-report=term-missing"
markers = ["integration: needs the docker compose stack running"]
