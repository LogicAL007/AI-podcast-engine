# Added on top of docker-compose.aws.yml when the demo server has a GPU (voice_backend =
# "chatterbox-gpu"): the voice worker runs Chatterbox with the cloned voices on the NVIDIA GPU,
# with CUDA PyTorch (PyPI's default build for Linux x86-64).

services:
  voice:
    build:
      args:
        EXTRAS: voice,llm,cloning
        TORCH_INDEX_URL: ""
    environment:
      TTS_BACKEND: chatterbox
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
