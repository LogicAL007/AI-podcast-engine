# Overlay for the AWS demo server (infra/demo): the same stack as docker-compose.yml, plus
#   - Caddy in front of the web app for HTTPS (Let's Encrypt);
#   - nothing published on the internet except Caddy's 80 and 443. The security group allows
#     only those two anyway.
# The voice worker is the base file's, with TTS_BACKEND=gemini (the server's .env).
# The server's deploy script sets COMPOSE_FILE in .env. Paths are relative to the repository root,
# the project directory.

services:
  web:
    ports: !reset [] # reached through Caddy only

  # Local only: deploy.sh's data restore copies objects into the store through this port.
  s3:
    ports: !override ["127.0.0.1:9010:9000"]

  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    depends_on: [web]
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./infra/demo/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

volumes:
  caddy-data:
  caddy-config:
